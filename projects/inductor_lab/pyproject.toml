[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inductor-lab"
version = "0.1.0"
description = "Geometric-programming-based inductor design and optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gpkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inductor_lab"]

[tool.basedpyright]
include = ["src"]

# klayout's `pya` compat package ships no type stubs at all (see
# src/inductor_lab/klayout/compat.py), and even the stubbed `klayout.db` API
# leaves PCellDeclarationHelper.param()/pya's DTrans-family constructors
# partially typed. These rules would fire on any code calling that API
# correctly, so they're relaxed only for the klayout/ subpackage.
[[tool.basedpyright.executionEnvironments]]
root = "src/inductor_lab/klayout"
reportUnusedCallResult = false
reportAny = false
reportImplicitOverride = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
